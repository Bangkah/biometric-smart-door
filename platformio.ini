; ============================================================
; Biometric Smart Key & Management System
; Implementation Phase 1 - Hardware Prototype (Edge Only)
; ============================================================
[env:esp32dev]
; Versi platform dipin agar build CI reproducible (bukan 'latest' yang bisa berubah diam-diam).
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Adafruit Fingerprint library is only needed when MOCK_FINGERPRINT_MODE
; is disabled in include/config.h (i.e. when a real AS608/R307 sensor
; is physically connected). It is harmless to keep installed either way.
lib_deps =
    adafruit/Adafruit Fingerprint Sensor Library @ ^2.1.3
    bblanchon/ArduinoJson @ ^7.1.0

build_flags =
    -D CORE_DEBUG_LEVEL=3

; Phase 2: Local Event System & Memory Buffer menggunakan LittleFS
; untuk menyimpan ring buffer log secara persisten di flash.
; board_build.filesystem memastikan partisi data diformat/di-mount
; sebagai LittleFS (bukan SPIFFS legacy) oleh toolchain PlatformIO.
board_build.filesystem = littlefs

; ------------------------------------------------------------
; Env bench: HANYA untuk pengujian lokal dengan tools/mock_backend.py
; (HTTP polos di LAN). Firmware produksi (esp32dev) menolak http://
; sesuai SRS NFR-001.
; ------------------------------------------------------------
[env:esp32dev-bench]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D BACKEND_ALLOW_PLAIN_HTTP=1

; ------------------------------------------------------------
; env:esp32dev-phase3only — MEMBUKTIKAN (bukan hanya mengklaim) bahwa
; src/phase4/ benar-benar independen: build ini meniru persis apa yang
; terjadi saat branch `phase-3` dibuat TANPA folder src/phase4/ sama sekali
; (lihat strategi Git & "Batas Fase" di wiki/Architecture.md). Jika build
; ini pernah gagal, berarti ada kode Phase 3 yang diam-diam bergantung pada
; sesuatu di src/phase4/ — pelanggaran arah dependensi yang harus diperbaiki
; SEBELUM branch phase-3 dibuat, bukan ditemukan sesudahnya.
; ------------------------------------------------------------
[env:esp32dev-phase3only]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D ENABLE_PHASE4_FEATURES=0
build_src_filter =
    +<*>
    -<phase4/>

; ------------------------------------------------------------
; env:native — unit test HOST (tanpa ESP32/hardware), quality gate wajib
; sebelum PR di-review (lihat .github/workflows/firmware-ci.yml).
;
; Modul LOGIKA MURNI yang diuji di sini:
;   - backoff.h, time_estimate.h       : header-only, tanpa dependensi apa pun.
;   - event_logger.cpp                  : kode PRODUKSI Phase 2, dikompilasi
;     bersama LittleFS/Preferences/FreeRTOS PALSU TAPI FUNGSIONAL (in-memory,
;     lihat test/stubs/) sehingga ring buffer, ketahanan power-loss, dan
;     epoch/generasi log diuji sebagai PERILAKU NYATA, bukan syntax-check.
;   - phase4/access_policy.cpp          : kode PRODUKSI Phase 4, pola sama
;     (Preferences palsu-tapi-fungsional) untuk menguji persistensi
;     revocation lintas reboot.
;   - phase4/command_policy.h/.cpp      : header-only-style pure functions
;     (HMAC string building, freshness check) — beberapa vektor uji SENGAJA
;     identik dengan backend/tests/test_security.py untuk saling
;     silang-verifikasi Python vs C++ menghasilkan string yang SAMA PERSIS.
;
; Modul yang butuh Wi-Fi/HTTP sungguhan (network_manager, time_sync,
; api_client, command_client) TIDAK dikompilasi di sini — logika
; perhitungannya sudah diekstrak ke modul pure di atas; sisanya divalidasi
; lewat build esp32dev + bench-test manual (README bagian 11).
;
; build_src_filter: HANYA file di atas dari src/ yang ikut dikompilasi
; (bukan network_manager.cpp/api_client.cpp/command_client.cpp/main.cpp,
; dst — file-file itu #include <WiFi.h>/<HTTPClient.h> asli yang tidak
; tersedia di host). test_build_src=yes diperlukan agar filter ini berlaku.
; ------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++14
    -DESP32
    -Iinclude
    -Isrc
    -Isrc/phase4
    -Itest/stubs
test_build_src = yes
build_src_filter =
    -<*>
    +<event_logger.cpp>
    +<phase4/access_policy.cpp>
    +<phase4/command_policy.cpp>
