name: Quality Gate (Firmware + Backend)

# ------------------------------------------------------------------
# Quality gate untuk Biometric Smart Key & Management System.
#
# Dijalankan pada:
#   - Setiap Pull Request yang menargetkan `main` (phase-1, phase-2, dst)
#   - Setiap push ke branch berpola `phase-*` (feedback cepat sebelum PR dibuka)
#   - Manual trigger (workflow_dispatch) untuk re-run jika perlu
#
# Tiga lapis gate. Lapis 1 (cepat, tanpa toolchain ESP32/dependensi berat)
# jalan duluan secara paralel; lapis 2 (build ESP32 sungguhan, lambat)
# baru jalan setelah KEDUANYA di lapis 1 hijau — fail-fast, umpan balik
# kesalahan logika didapat dalam hitungan detik, bukan menunggu toolchain
# ESP32 selesai di-download terlebih dahulu:
#
#   1a. firmware-unit-tests : `pio test -e native` — backoff.h,
#       time_estimate.h, url_utils.h (pure), dan event_logger.cpp /
#       phase4/access_policy.cpp / phase4/command_policy.cpp (kode
#       PRODUKSI, bukan tiruan) diuji sebagai PERILAKU nyata di host.
#   1b. backend-tests       : pytest + coverage minimum + ruff lint
#       untuk backend/ (FastAPI). Dijalankan PARALEL dengan 1a (bahasa
#       & toolchain berbeda, tidak saling bergantung).
#
#   2.  firmware-build : `pio run`, MATRIX TIGA environment:
#       - esp32dev            : build produksi, Phase 4 AKTIF, TLS wajib.
#       - esp32dev-bench      : seperti esp32dev, HTTP lokal diizinkan
#                               (kompatibilitas tools/mock_backend.py).
#       - esp32dev-phase3only : ENABLE_PHASE4_FEATURES=0 DAN src/phase4/
#                               dikeluarkan dari build_src_filter sama
#                               sekali -- MEMBUKTIKAN (bukan mengklaim)
#                               bahwa branch `phase-3` tetap compile
#                               walau folder phase4/ belum/tidak ada.
#       Diikuti `pio check` yang SEKARANG MENGGAGALKAN pipeline bila ada
#       defect severity "high" (bukan lagi laporan semata).
#
# PR TIDAK dianggap lulus quality gate sebelum SEMUA job di bawah hijau.
# ------------------------------------------------------------------

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "phase-*"
  workflow_dispatch: {}

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================================================================
  # LAPIS 1a: Unit test firmware murni (host, tanpa ESP32) — cepat.
  # ==================================================================
  firmware-unit-tests:
    name: Firmware unit tests (env:native)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO core
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-native-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-native-

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      # ---- QUALITY GATE: seluruh test suite di test/ wajib lulus ----
      # test_backoff, test_time_estimate, test_url_utils (pure logic),
      # test_event_logger, test_access_policy (kode produksi + stub NVS
      # fungsional), test_command_policy (silang-verifikasi vs backend
      # Python — lihat platformio.ini [env:native] untuk cakupan lengkap).
      - name: Jalankan unit test (native)
        run: pio test -e native --verbose

  # ==================================================================
  # LAPIS 1b: Backend (FastAPI) — pytest + coverage + lint. Paralel
  # dengan firmware-unit-tests (tidak saling bergantung).
  # ==================================================================
  backend-tests:
    name: Backend tests (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # ---- QUALITY GATE: lint wajib bersih (tidak ada --fix di CI) ----
      - name: Lint (ruff)
        run: ruff check .

      # ---- QUALITY GATE: seluruh test wajib lulus + coverage minimum ----
      # Ambang 90% SENGAJA sedikit di bawah angka aktual proyek ini (~97%)
      # supaya ada ruang wajar, tapi tetap menolak penurunan coverage yang
      # signifikan tanpa penjelasan.
      - name: Test + coverage (pytest)
        env:
          ADMIN_API_KEY: ci-test-admin-key
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=90

  # ==================================================================
  # LAPIS 2: Build firmware ESP32 sungguhan — hanya jalan jika KEDUA
  # job Lapis 1 lulus.
  # ==================================================================
  firmware-build:
    name: Firmware build (${{ matrix.environment }})
    needs: [firmware-unit-tests, backend-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [esp32dev, esp32dev-bench, esp32dev-phase3only]

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache core PlatformIO + toolchain + library agar build berikutnya
      # jauh lebih cepat (tidak download ulang toolchain ESP32 tiap run).
      - name: Cache PlatformIO core & libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ matrix.environment }}-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.environment }}-

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Tampilkan versi & environment terdeteksi
        run: |
          pio --version
          pio project config -e ${{ matrix.environment }}

      # ---- QUALITY GATE UTAMA: build wajib sukses tanpa error ----
      - name: Build firmware (${{ matrix.environment }})
        run: pio run -e ${{ matrix.environment }}

      # ---- Static analysis: SEKARANG MENGGAGALKAN pipeline untuk defect
      # severity "high" (dulu hanya laporan lewat "|| true"). Severity
      # medium/low tetap tampil di log sebagai info, tidak menggagalkan,
      # supaya noise dari header vendor (ESP-IDF/Arduino core) tidak
      # memblokir PR yang sah.
      - name: Static check (cppcheck via PlatformIO)
        run: pio check -e ${{ matrix.environment }} --skip-packages --fail-on-defect=high --severity=high,medium,low

      - name: Ringkasan ukuran firmware
        if: success()
        run: pio run -e ${{ matrix.environment }} --target size

  # ==================================================================
  # Ringkasan tunggal untuk branch protection rule ("1 required check"
  # alih-alih harus mendaftarkan semua nama job+matrix satu per satu).
  # ==================================================================
  quality-gate:
    name: Quality gate (ringkasan)
    needs: [firmware-unit-tests, backend-tests, firmware-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Periksa semua job lapis sebelumnya lulus
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "Satu atau lebih job quality gate GAGAL." >&2
            exit 1
          fi
          echo "Semua job quality gate lulus."
