name: Firmware CI (PlatformIO Build Gate)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "phase-*"
  workflow_dispatch: {}

concurrency:
  group: firmware-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (env:esp32dev)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO core & libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Tampilkan versi & environment terdeteksi
        working-directory: biometric-smart-key-2
        run: |
          pio --version
          pio project config

      - name: Build firmware (esp32dev)
        working-directory: biometric-smart-key-2
        run: pio run -e esp32dev

      - name: Static check (cppcheck via PlatformIO)
        working-directory: biometric-smart-key-2
        run: pio check -e esp32dev --skip-packages || true

      - name: Ringkasan ukuran firmware
        if: success()
        working-directory: biometric-smart-key-2
        run: pio run -e esp32dev --target size
